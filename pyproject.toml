[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-task-dag-critical-path-scheduler-skill"
version = "1.0.0"
description = "Directed Acyclic Graph (DAG) task scheduling engine implementing Critical Path Method (CPM) and slack computation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-task-dag-critical-path-scheduler-skill"
Repository = "https://github.com/alphaparkinc/genpark-task-dag-critical-path-scheduler-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-task-dag-critical-path-scheduler-skill/issues"
